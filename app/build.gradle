apply plugin: 'com.android.application'

android {
    namespace 'com.recnonstop.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.recnonstop.app"
        minSdk 29
        targetSdk 35
        versionCode 13
        versionName "1.3"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        debug {
            def demoAssets = project.findProperty("recnonstopDemoAssets")
            if (demoAssets) {
                assets.srcDirs += [demoAssets]
            }
        }
    }
}
